[project]
name = "affiliate-post-monitor-backend"
version = "0.1.0"
description = "FastAPI backend for Affiliate Post Monitor"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
